dataset:
  name: ycbv
  root: /path/to/bop/datasets/ycbv
  mask_folder: mask_visib
  use_visible_mask: true
  img_size: null
  val_split_ratio: 0.1
  val_seed: 42
  variants:
    real:
      train_folder: ycbv_train_real
      test_folder: ycbv_test_all
    synthetic:
      train_folder: ycbv_train_pbr
      test_folder: ycbv_test_all
    edit_only:
      train_folder: train_edit_only
      test_folder: ycbv_test_all
    free_only:
      train_folder: train_free_only
      test_folder: ycbv_test_all
    edit_free:
      train_folder: train_edit_free
      test_folder: ycbv_test_all
    synthetic_real:
      train_folder: ycbv_train_real
      test_folder: ycbv_test_all
    matrix_g1_hp0:
      train_folder: train_g1.0_hp0
      test_folder: ycbv_test_all
    matrix_g1_hp1:
      train_folder: train_g1.0_hp1
      test_folder: ycbv_test_all
    matrix_g1_hp2:
      train_folder: train_g1.0_hp2
      test_folder: ycbv_test_all
    matrix_g1_hp4:
      train_folder: train_g1.0_hp4
      test_folder: ycbv_test_all
    matrix_g1_hp8:
      train_folder: train_g1.0_hp8
      test_folder: ycbv_test_all
    matrix_g1_hp16:
      train_folder: train_g1.0_hp16
      test_folder: ycbv_test_all
    matrix_g1_hp32:
      train_folder: train_g1.0_hp32
      test_folder: ycbv_test_all
    smoke_test:
      train_folder: ycbv_train_pbr
      test_folder: ycbv_test_all
  classes:
    1: 002_master_chef_can
    2: 003_cracker_box
    3: 004_sugar_box
    4: 005_tomato_soup_can
    5: 006_mustard_bottle
    6: 007_tuna_fish_can
    7: 008_pudding_box
    8: 009_gelatin_box
    9: 010_potted_meat_can
    10: 011_banana
    11: 019_pitcher_base
    12: 021_bleach_cleanser
    13: 024_bowl
    14: 025_mug
    15: 035_power_drill
    16: 036_wood_block
    17: 037_scissors
    18: 040_large_marker
    19: 051_large_clamp
    20: 052_extra_large_clamp
    21: 061_foam_brick

output:
  yolo_data_root: evaluation/yolo/data
  runs_root: evaluation/yolo/runs

train:
  model: yolov8n-seg.pt
  epochs: 20
  batch: 12
  workers: 2
  device: 0
  imgsz: null
  patience: 25
  lr0: 0.01
  lrf: 0.01
  weight_decay: 0.0005
  early_stop:
    enabled: true
    window: 3
    min_delta: 0.005
    min_epochs: 5
  staged:
    pretrain_variant: synthetic
    finetune_variant: real
    finetune_save_name: synthetic_real
    finetune_from: null
    finetune_overrides:
      epochs: 10
      lr0: 0.003
      lrf: 0.003
      patience: 10
      limit_samples: 100

eval:
  split: test
  conf: 0.25
  iou: 0.5
  max_det: 300
  device: 0
  imgsz: 640
  batch: 1
  limit: null
  chunk_size: 200
  half: true
  empty_cache: true

summary:
  variants: [real, synthetic, synthetic_real, edit_only, free_only, edit_free]
